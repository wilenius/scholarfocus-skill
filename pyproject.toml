[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarlib"
dynamic = ["version"]
description = "Shared bibliographic-API library behind the scholarfocus and litreview agent skills"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Heikki Wilenius" }]
keywords = ["bibliography", "openalex", "orcid", "literature-review", "agent-skills"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
fast = ["rapidfuzz>=3.6"]
zotero = ["pyzotero>=1.5"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/wilenius/scholarfocus-skill"
Repository = "https://github.com/wilenius/scholarfocus-skill"
Issues = "https://github.com/wilenius/scholarfocus-skill/issues"

[project.scripts]
scholarfocus = "scholarlib.cli.scholarfocus:main"
litreview = "scholarlib.cli.litreview:main"
jstor-index = "scholarlib.cli.jstor_index:main"

[tool.setuptools.dynamic]
version = { attr = "scholarlib.__version__" }

[tool.setuptools.packages.find]
include = ["scholarlib*"]

[tool.setuptools.package-data]
scholarlib = ["config.example.yaml", "jstor/*.sql"]

[tool.pyright]
pythonVersion = "3.11"
include = ["scholarlib", "tests"]
reportMissingImports = "warning"
